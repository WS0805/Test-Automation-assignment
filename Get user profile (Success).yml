runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code should be 200", function () {
            expect(res.status).to.equal(200);
          });

          const data = res.body.data;

          test("ID should be 12", function () {
            expect(data.id).to.equal(12);
          });

          test("Email should match", function () {
            expect(data.email).to.equal("rachel.howell@reqres.in");
          });

          test("First Name should be Rachel", function () {
            expect(data.first_name).to.equal("Rachel");
          });

          test("Last Name should be Howell", function () {
            expect(data.last_name).to.equal("Howell");
          });

          test("Avatar should match", function () {
            expect(data.avatar).to.equal("https://reqres.in/img/faces/12-image.jpg");
        });

